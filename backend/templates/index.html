<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wall Finishing Robot - Control System</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1> Wall Finishing Robot Control System</h1>
            <p class="subtitle">Intelligent Coverage Path Planning & Visualization</p>
        </header>

        <div class="main-content">
            <!-- Input Panel -->
            <div class="panel input-panel">
                <h2>Configuration</h2>

                <div class="form-group">
                    <label>Wall Name:</label>
                    <input type="text" id="wallName" placeholder="e.g., Wall-1" value="Wall-1">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Wall Width (m):</label>
                        <input type="number" id="wallWidth" value="5.0" step="0.1" min="0.1">
                    </div>
                    <div class="form-group">
                        <label>Wall Height (m):</label>
                        <input type="number" id="wallHeight" value="5.0" step="0.1" min="0.1">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Tool Width (m):</label>
                        <input type="number" id="toolWidth" value="0.25" step="0.01" min="0.01">
                    </div>
                    <div class="form-group">
                        <label>Overlap (%):</label>
                        <input type="number" id="overlap" value="10" step="1" min="0" max="50">
                    </div>
                </div>

                <h3>Obstacles</h3>
                <div id="obstaclesList"></div>
                <button class="btn btn-secondary" onclick="addObstacle()">+ Add Obstacle</button>

                <div class="actions">
                    <button class="btn btn-primary" onclick="computeTrajectory()">🚀 Compute Trajectory</button>
                    <button class="btn btn-secondary" onclick="clearCanvas()">Clear</button>
                </div>

                <div id="loadingIndicator" class="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>Computing optimal path...</p>
                </div>
            </div>

            <!-- Visualization Panel -->
            <div class="panel visualization-panel">
                <h2>Trajectory Visualization</h2>
                <canvas id="canvas" width="600" height="600"></canvas>

                <div class="playback-controls">
                    <button class="btn btn-small" onclick="playTrajectory()" id="playBtn">▶ Play</button>
                    <button class="btn btn-small" onclick="pauseTrajectory()" id="pauseBtn">⏸ Pause</button>
                    <button class="btn btn-small" onclick="resetTrajectory()">⏮ Reset</button>
                    <input type="range" id="speedControl" min="1" max="100" value="9" onchange="updateSpeed()">
                    <label>Speed: <span id="speedLabel">9</span>x</label>
                </div>

                <!-- Legend outside canvas -->
                <div class="legend">
                    <div class="legend-item">
                        <span class="legend-area" style="background: rgba(37, 99, 235, 0.15); border: 1px solid #2563eb;"></span>
                        <span>Coverage Area</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-line" style="background: #2563eb;"></span>
                        <span>Paint Path</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-line legend-dashed" style="background: #94a3b8;"></span>
                        <span>Travel Path</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot" style="background: #10b981;"></span>
                        <span>Paint Start</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot" style="background: #ef4444;"></span>
                        <span>Paint End / Obstacle</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot" style="background: #f59e0b;"></span>
                        <span>Current Position</span>
                    </div>
                </div>

                <div id="pathExplanation" class="explanation"></div>
            </div>
        </div>

        <!-- Statistics Panel -->
        <div class="panel stats-panel">
            <h2>Trajectory Statistics</h2>
            <div id="statistics"></div>
        </div>

        <!-- Saved Trajectories -->
        <div class="panel">
            <h2>Saved Trajectories</h2>
            <div id="savedTrajectories"></div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
